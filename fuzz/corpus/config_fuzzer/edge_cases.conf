# Edge cases config
; Semicolon comment

[empty_section]

[types]
string_val = hello world
int_val = 42
float_val = 3.14159
bool_true = true
bool_false = no
bool_on = on

[quotes]
quoted = "value with spaces"
single_quoted = 'another value'
unquoted = nospaces

[multiline]
long_value = this is a \
    multi-line value that \
    spans three lines

[special]
with_equals = key=value=pair
with_hash = value # inline comment
env_var = ${HOME}/config
win_env = %USERPROFILE%\config

[edge]
empty_value =
no_value
just_key =
very_long_key_name_that_goes_on_and_on_and_on_and_on = short
k = very_long_value_that_goes_on_and_on_and_on_and_on_and_on_and_on

[unicode]
emoji = 🔥 fire
cjk = 中文测试
accent = café résumé naïve
