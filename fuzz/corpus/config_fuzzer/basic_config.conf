# ViewBrowserHistory Configuration
# This is a sample configuration file

[general]
browser_order = brave, firefox, chrome
default_days = 30
output_dir = ~/browser-history-exports
verbose = true

[categories]
config_file = ~/.config/viewbrowserhistory/categories.conf
enabled = true

[export]
default_format = json
include_stats = true
max_entries = 10000

[search]
case_sensitive = false
max_results = 500
rank_by_visits = true
rank_by_recency = true

[fuzz]
max_memory_mb = 100
timeout_seconds = 60
